<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== RÉGLAGES PROFESSEUR (modifiables) ===================== */
const CONFIG = {
  poids: { collectif: 40, esprit: 40, entraide: 20 },
  touchesMini: 3,
  compteurs: [
    { id:"collectif", titre:"Action collective (disque passé par 3 joueurs ou +)", aide:"Réussie ou non, elle compte !", seuils:[2,4,7] },
    { id:"sequence",  titre:"Longue séquence (5 passes ou + sans perte)", aide:"L'équipe garde le disque en le faisant circuler", seuils:[1,2,4] },
    { id:"soutien",   titre:"Un joueur vient aider le porteur bloqué", aide:"Il se rapproche pour proposer une passe courte", seuils:[2,4,7] },
    { id:"exclusif",  titre:"Vigilance : jeu à 2 seulement", aide:"Deux joueurs jouent entre eux et oublient les autres", seuils:[1,2,4], inverse:true }
  ],
  esprit: [
    { id:"regles",   titre:"Connaissance et respect des règles", aide:"Pas de marcher avec le disque, compte des 10 s, sorties…" },
    { id:"contact",  titre:"Pas de contact, pas de faute volontaire", aide:"On joue le disque, pas l'adversaire" },
    { id:"honnete",  titre:"Fair-play et honnêteté", aide:"L'équipe annonce ses propres fautes et accepte les appels" },
    { id:"attitude", titre:"Attitude positive et maîtrise de soi", aide:"L'équipe reste calme, même quand elle perd" },
    { id:"comm",     titre:"Communication respectueuse", aide:"Les litiges se règlent en discutant calmement" }
  ],
  entraide: [
    { id:"e0", t:"On encourage un coéquipier après une erreur" },
    { id:"e1", t:"On donne le disque à celui qui l'a peu touché" },
    { id:"e2", t:"On explique une règle ou un placement à un camarade" },
    { id:"e3", t:"On félicite l'équipe adverse pour une belle action" },
    { id:"e4", t:"On organise l'équipe ensemble (placements, tactique)" }
  ],
  equipesParDefaut: ["Bleu","Rouge","Vert","Jaune"],
  codeProf: "2026"          // ← code demandé pour ouvrir l'interface prof : changez-le !
};
const NIVEAUX = [
  { min:0,  nom:"Maîtrise insuffisante", c:"var(--l1)" },
  { min:40, nom:"Maîtrise fragile",       c:"var(--l2)" },
  { min:60, nom:"Maîtrise satisfaisante", c:"var(--l3)" },
  { min:80, nom:"Très bonne maîtrise",    c:"var(--l4)" }
];
const FREQ = ["Jamais","Parfois","Souvent"];
const COULEURS = { bleu:"#1E5DBA", rouge:"#CC3A2E", vert:"#1D8047", jaune:"#C99A00", orange:"#D2631C", rose:"#D94F8C",
  violet:"#6A4FB5", noir:"#2B2B2B", blanc:"#9AA6B2", gris:"#6B7680", marron:"#8A5A3B", turquoise:"#159A9C", ciel:"#4A9FE0" };

/* ===================== OUTILS ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2,8);
const arr = x => !x ? [] : Array.isArray(x) ? x.filter(Boolean) : Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]).filter(Boolean);
const norm = t => String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
function teamColor(nom){ const n=norm(nom); for(const k in COULEURS) if(n.includes(k)) return COULEURS[k]; return "var(--ink)"; }
const tName = t => (t && t.nom.trim()) || "Équipe sans nom";
const cidOf = nom => nom.trim().replace(/[.#$\[\]\/\s]+/g,"_");
let toastT; function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2200); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(15) }catch(e){} }

/* ===================== BASE DE DONNÉES ===================== */
const ROOT = "ultimate5e";
function makeFirebaseDB(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  const ref = p => db.ref(p ? ROOT+"/"+p : ROOT);
  return {
    mode:"firebase",
    on(cb){ ref("").on("value", s => cb(s.val() || {})); },
    onConn(cb){ db.ref(".info/connected").on("value", s => cb(!!s.val())); },
    set(p,v){ return ref(p).set(v ?? null); }
  };
}
function makeLocalDB(){
  const K="ultimate5e_demo"; let S={}; const subs=[];
  const load=()=>{ try{ S=JSON.parse(localStorage.getItem(K))||{} }catch(e){ S={} } };
  const clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const notify=()=>subs.forEach(cb=>cb(clone(S)||{}));
  load();
  window.addEventListener("storage",e=>{ if(e.key===K){ load(); notify(); } });
  return {
    mode:"demo",
    on(cb){ subs.push(cb); cb(clone(S)||{}); },
    onConn(cb){ cb(true); },
    set(p,v){
      const ks=p.split("/").filter(Boolean); let o=S;
      for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
      if(v==null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]]=clone(v);
      try{ localStorage.setItem(K,JSON.stringify(S)) }catch(e){}
      notify(); return Promise.resolve();
    }
  };
}
let DB;
try{ DB = (FIREBASE_CONFIG && window.firebase) ? makeFirebaseDB() : makeLocalDB(); }
catch(e){ console.error(e); DB = makeLocalDB(); }

/* ===================== DONNÉES ===================== */
function normClass(c){
  if(!c) return null;
  return { nom:c.nom||"", current:c.current||null, fiches:c.fiches||{},
    teams: arr(c.teams).map(t=>({ id:t.id, nom:t.nom||"", joueurs:arr(t.joueurs) })) };
}
function normFiche(f){
  f=f||{};
  return { absents:f.absents||{}, touches:f.touches||{},
    cpt:Object.assign(Object.fromEntries(CONFIG.compteurs.map(c=>[c.id,0])), f.cpt||{}),
    esprit:f.esprit||{}, entraide:f.entraide||{}, pts:f.pts||0, envoye:!!f.envoye, obsNoms:f.obsNoms||"",
    meta:f.meta||{} };
}
const ficheKey = (observedId, advId) => observedId + "__" + advId;

/* Planning : tout le monde se rencontre une fois, les équipes libres observent */
function schedule(teams){
  if(teams.length<2) return [];
  const a0=teams.slice(); if(a0.length%2) a0.push(null);
  const N=a0.length; let pos=[a0[0],...a0.slice(2),a0[1]], list=[];
  for(let r=0;r<N-1;r++){
    for(let i=0;i<N/2;i++){ const a=pos[i], b=pos[N-1-i]; if(a&&b) list.push([a,b]); }
    pos=[pos[0],pos[N-1],...pos.slice(1,N-1)];
  }
  const out=[];
  while(list.length){
    const p=out[out.length-1];
    let k=p?list.findIndex(g=>!g.includes(p[0])&&!g.includes(p[1])):0; if(k<0) k=0;
    out.push(list.splice(k,1)[0]);
  }
  return out.map(([a,b],i)=>{
    const libres=teams.filter(x=>x!==a&&x!==b);
    return { i, a, b, obs1:libres[0]||null, obs2:libres[1]||null, attente:libres.slice(2) };
  });
}
const findGame = (games,cur) => cur ? games.find(g=>g.a.id===cur.a && g.b.id===cur.b) : null;

/* ===================== CALCULS ===================== */
function n4(v,s,inv){ let n=1; s.forEach(x=>{ if(v>=x) n++ }); return inv?5-n:n; }
function scores(team,f){
  const pres=team.joueurs.filter(j=>!f.absents[j.id]);
  const ok=pres.filter(j=>(f.touches[j.id]||0)>=CONFIG.touchesMini).length;
  const part=pres.length?ok/pres.length*100:0;
  const pn=part>=100?4:part>=75?3:part>=50?2:1;
  const notes=[pn,...CONFIG.compteurs.map(c=>n4(f.cpt[c.id]||0,c.seuils,c.inverse))];
  const collectif=notes.reduce((a,b)=>a+b,0)/(notes.length*4)*100;
  const esprit=Object.values(f.esprit).reduce((a,b)=>a+b,0)/(CONFIG.esprit.length*4)*100;
  const entraide=Object.values(f.entraide).reduce((a,b)=>a+b,0)/(CONFIG.entraide.length*2)*100;
  const p=CONFIG.poids, tot=p.collectif+p.esprit+p.entraide;
  return { part, ok, nPres:pres.length, collectif, esprit, entraide,
    global:(collectif*p.collectif+esprit*p.esprit+entraide*p.entraide)/tot };
}
const complete = f => Object.keys(f.esprit).length===CONFIG.esprit.length && Object.keys(f.entraide).length===CONFIG.entraide.length;
const niv = p => [...NIVEAUX].reverse().find(n=>p>=n.min);
const lvlChip = (f,s) => complete(f) ? `<span class="lvl" style="background:${niv(s.global).c}">${niv(s.global).nom}</span>` : `<span class="st">en cours</span>`;
const teamTag = t => t ? `<span class="tag"><span class="dot" style="background:${teamColor(t.nom)}"></span>${esc(tName(t))}</span>` : "—";

function initProf(){
  DB.onConn(c=>{ CONNECTED=c; if(ROOTDATA) renderProf(); });
  DB.on(d=>{ ROOTDATA=d; renderProf(); });

  document.addEventListener("change",e=>{
    const t=e.target;
    if(t.id==="classSel"){ DB.set("active", t.value||null); }
    if(t.dataset.tname!==undefined){ const C=profClass(); C.teams[+t.dataset.tname].nom=t.value.trim(); DB.set(CP()+"/teams",C.teams); }
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Enter" && e.target.dataset.addpl!==undefined){ e.preventDefault(); addPlayer(+e.target.dataset.addpl); }
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const C=profClass(), a=b.dataset.act;
    if(a==="lock"){ try{ localStorage.removeItem(PROF_KEY) }catch(e){} location.hash=""; return; }
    if(a==="newClass"){
      const nom=prompt("Nom de la classe (ex : 5C)"); if(!nom||!nom.trim()) return;
      const cid=cidOf(nom);
      if((ROOTDATA.classes||{})[cid]){ DB.set("active",cid); toast("Cette classe existe déjà, elle est sélectionnée."); return; }
      DB.set("classes/"+cid,{ nom:nom.trim(), teams:CONFIG.equipesParDefaut.map(n=>({id:uid("t"),nom:n,joueurs:[]})) }).then(()=>DB.set("active",cid));
      return;
    }
    if(!C) return;
    const games=schedule(C.teams), cur=findGame(games,C.current);
    if(a==="delClass"){ if(!confirm(`Supprimer la classe ${C.nom} et tous ses résultats ? C'est définitif.`)) return; DB.set(CP(),null).then(()=>DB.set("active",null)); }
    if(a==="addTeam"){ C.teams.push({id:uid("t"),nom:"",joueurs:[]}); DB.set(CP()+"/teams",C.teams); }
    if(a==="delTeam"){ const t=C.teams[+b.dataset.t]; if(!confirm(`Supprimer l'équipe ${tName(t)} ?`)) return; C.teams.splice(+b.dataset.t,1); DB.set(CP()+"/teams",C.teams); }
    if(a==="addPl"){ addPlayer(+b.dataset.t); }
    if(a==="rmPl"){ const t=C.teams[+b.dataset.t], j=t.joueurs.find(x=>x.id===b.dataset.j); if(!confirm(`Retirer ${j.nom} ?`)) return;
      t.joueurs=t.joueurs.filter(x=>x.id!==b.dataset.j); DB.set(CP()+"/teams",C.teams); }
    if(a==="launch"){ const g=games[+b.dataset.i]; DB.set(CP()+"/current",{a:g.a.id,b:g.b.id}); toast(`Match ${g.i+1} lancé sur les tablettes`); }
    if(a==="next"){
      const i=cur?cur.i+1:0;
      if(i>=games.length){ DB.set(CP()+"/current",null); toast("Tous les matchs sont joués 🎉"); return; }
      DB.set(CP()+"/current",{a:games[i].a.id,b:games[i].b.id}); toast(`Match ${i+1} lancé sur les tablettes`);
    }
    if(a==="stop"){ DB.set(CP()+"/current",null); }
    if(a==="resetAll"){
      const nb=Object.keys(C.fiches).length;
      if(!confirm(`Remettre à zéro tous les matchs de ${C.nom} ?\n\n${nb} fiche(s) seront effacées définitivement. Les équipes et les joueurs sont conservés.\n\nPensez à exporter le CSV avant si besoin.`)) return;
      DB.set(CP()+"/fiches",null).then(()=>DB.set(CP()+"/current",null)).then(()=>toast("Tous les matchs sont remis à zéro"));
    }
    if(a==="csv"){ exportCSV(C,games); }
  });
}
function addPlayer(ti){
  const C=profClass(), t=C.teams[ti], inp=$("np_"+t.id), v=inp.value.trim(); if(!v) return;
  t.joueurs.push({id:uid("j"),nom:v}); inp.value=""; DB.set(CP()+"/teams",C.teams).then(()=>{ const el=$("np_"+t.id); if(el) el.focus(); });
}
function exportCSV(C,games){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const head=["Classe","Match","Équipe observée","Adversaire","Équipe observatrice","Observateurs","Joueur","Présent","Touches de disque",
    "Participation %",...CONFIG.compteurs.map(c=>c.titre),...CONFIG.esprit.map(e=>"Esprit - "+e.titre),...CONFIG.entraide.map(e=>"Entraide - "+e.t),
    "Points (info)","Jeu collectif %","Esprit du jeu %","Entraide %","Global %","Niveau"];
  const rows=[];
  games.forEach(g=>[[g.a,g.b,g.obs1],[g.b,g.a,g.obs2]].forEach(([t,adv,obs])=>{
    const raw=C.fiches[ficheKey(t.id,adv.id)]; if(!raw) return;
    const f=normFiche(raw), s=scores(t,f);
    const common=[Math.round(s.part),...CONFIG.compteurs.map(c=>f.cpt[c.id]||0),...CONFIG.esprit.map(e=>f.esprit[e.id]??""),
      ...CONFIG.entraide.map(e=>f.entraide[e.id]!==undefined?FREQ[f.entraide[e.id]]:""),f.pts,
      Math.round(s.collectif),Math.round(s.esprit),Math.round(s.entraide),Math.round(s.global),complete(f)?niv(s.global).nom:"incomplet"];
    t.joueurs.forEach(j=>{ const abs=!!f.absents[j.id];
      rows.push([C.nom,g.i+1,tName(t),tName(adv),obs?tName(obs):"",f.obsNoms,j.nom,abs?"non":"oui",abs?"":(f.touches[j.id]||0),...common].map(q).join(";")); });
  }));
  if(!rows.length){ toast("Aucune fiche à exporter"); return; }
  const blob=new Blob(["﻿"+[head.map(q).join(";"),...rows].join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`ultimate_${cidOf(C.nom)}_${new Date().toISOString().slice(0,10)}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

let SIDE=1, LOCAL=null, LOCALKEY=null, EDITING=false;
function tabCtx(){
  const cid=ROOTDATA.active, C=cid?normClass((ROOTDATA.classes||{})[cid]):null;
  if(!C) return {C:null};
  const games=schedule(C.teams), g=findGame(games,C.current);
  if(!g) return {C,games,g:null};
  const observed = SIDE===1?g.a:g.b, adv = SIDE===1?g.b:g.a, obsTeam = SIDE===1?g.obs1:g.obs2;
  return { C, games, g, observed, adv, obsTeam, key:ficheKey(observed.id,adv.id), path:`classes/${cid}/fiches/${ficheKey(observed.id,adv.id)}` };
}
function saveLocal(){
  const x=tabCtx(); if(!x.g||x.key!==LOCALKEY) return;
  LOCAL.meta={ match:x.g.i+1, observe:tName(x.observed), adversaire:tName(x.adv), observateurs:x.obsTeam?tName(x.obsTeam):"", tablette:SIDE };

}

  <section class="card">
    <h2 style="font-size:1.3rem">Tout le monde joue ?</h2>
    <p class="hint">Appuyez sur <b>+</b> chaque fois que le joueur reçoit le disque. Le <b>−</b> corrige une erreur.</p>
    <div class="touch">${pres.map(j=>{ const n=f.touches[j.id]||0, cls=n>=CONFIG.touchesMini?"ok":n?"low":"";
      return `<div class="tp ${cls}"><b>${esc(j.nom)}</b><div class="ctl">
        <button class="cbtn minus" data-act="tm" data-j="${j.id}" aria-label="moins pour ${esc(j.nom)}">−</button>
        <span class="n">${n}</span>
        <button class="cbtn plus" data-act="tp" data-j="${j.id}" aria-label="plus pour ${esc(j.nom)}">+</button></div></div>`}).join("")}</div>
    <p class="hint" style="margin:10px 0 0"><b>${ok}/${pres.length}</b> joueurs ont touché le disque au moins ${CONFIG.touchesMini} fois.</p>
  </section>
  <section class="card">
    <h2 style="font-size:1.3rem">Le jeu collectif</h2>
    <p class="hint">Une action collective qui échoue compte autant qu'une action qui réussit !</p>
    <div>${CONFIG.compteurs.map(c=>`<div class="counter ${c.inverse?"vig":""}"><div class="txt"><b>${c.titre}</b><small>${c.aide}</small></div>
      <button class="cbtn minus" data-act="cpt" data-c="${c.id}" data-d="-1" aria-label="moins">−</button><span class="val">${f.cpt[c.id]||0}</span>
      <button class="cbtn plus" data-act="cpt" data-c="${c.id}" data-d="1" aria-label="plus">+</button></div>`).join("")}</div>
    <div class="mini"><span style="flex:1">Points marqués <i>(pour info, ne compte pas)</i></span>
      <button class="cbtn minus" data-act="pts" data-d="-1">−</button><span class="val" style="font-size:1.2rem">${f.pts}</span><button class="cbtn plus" data-act="pts" data-d="1">+</button></div>
  </section>

  <div class="phase p3"><span class="ico">3</span><h3>Après le match</h3></div>
  <section class="card">
    <h2 style="font-size:1.3rem">L'esprit du jeu de l'équipe</h2>
    <p class="hint">0 = pas du tout · 4 = excellent</p>
    ${CONFIG.esprit.map(e=>`<div class="crit"><b>${e.titre}</b><small>${e.aide}</small><div class="scale s5">
      ${lab.map((l,i)=>`<button data-act="esp" data-k="${e.id}" data-n="${i}" class="${f.esprit[e.id]===i?"on":""}"><strong>${i}</strong>${l}</button>`).join("")}</div></div>`).join("")}
  </section>
  <section class="card">
    <h2 style="font-size:1.3rem">L'entraide dans l'équipe</h2>
    <p class="hint">À quelle fréquence l'avez-vous vu ?</p>
    ${CONFIG.entraide.map(e=>`<div class="crit"><b>${e.t}</b><div class="scale s3" style="margin-top:8px">
      ${FREQ.map((l,i)=>`<button data-act="ent" data-k="${e.id}" data-n="${i}" class="${f.entraide[e.id]===i?"on":""}">${l}</button>`).join("")}</div></div>`).join("")}
  </section>
  <div class="sendbar"><button class="btn pri big" data-act="send">${complete(f)?"Envoyer la fiche au prof ✔":`Envoyer la fiche (encore ${CONFIG.esprit.length+CONFIG.entraide.length-Object.keys(f.esprit).length-Object.keys(f.entraide).length} réponses)`}</button></div>`;

  const y=window.scrollY;
  $("app").innerHTML = h;
  window.scrollTo(0,y);
}
function initTablette(side){
  SIDE=side;
  DB.on(d=>{
    ROOTDATA=d;
    if(document.activeElement && document.activeElement.id==="obsNoms") return;   // ne pas couper la saisie
    renderTab();
  });
  document.addEventListener("change",e=>{
    if(e.target.id==="obsNoms" && LOCAL){ LOCAL.obsNoms=e.target.value.trim(); saveLocal(); }
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-act]"); if(!b||!LOCAL) return;
    const f=LOCAL, a=b.dataset.act, d=b.dataset;
    if(a==="tm"){ e.stopPropagation(); f.touches[d.j]=Math.max(0,(f.touches[d.j]||0)-1); }
    else if(a==="tp"){ f.touches[d.j]=(f.touches[d.j]||0)+1; buzz(); }
    else if(a==="abs"){ if(f.absents[d.j]) delete f.absents[d.j]; else f.absents[d.j]=true; }
    else if(a==="cpt"){ f.cpt[d.c]=Math.max(0,(f.cpt[d.c]||0)+ +d.d); buzz(); }
    else if(a==="pts"){ f.pts=Math.max(0,f.pts+ +d.d); }
    else if(a==="esp"){ f.esprit[d.k]=+d.n; }
    else if(a==="ent"){ f.entraide[d.k]=+d.n; }
    else if(a==="send"){
      if(!complete(f)){ toast("Répondez d'abord à toutes les questions de la partie 3 (Après le match)"); return; }
      f.envoye=true; EDITING=false; window.scrollTo({top:0,behavior:"smooth"}); toast("Fiche envoyée au prof ✔");
    }
    else if(a==="edit"){ EDITING=true; renderTab(true); return; }
    else return;
    saveLocal(); renderTab(true);
  });
}

/* ===================== DÉMARRAGE ===================== */
/* Accès prof protégé par un code (mémorisé sur le PC une fois saisi) */
const PROF_KEY="ultimate5e_prof_ok";
function profUnlocked(){ try{ return localStorage.getItem(PROF_KEY)===CONFIG.codeProf }catch(e){ return false } }
function renderLock(err){
  $("app").innerHTML=`<div class="home"><div class="card" style="max-width:380px;width:100%">
    <div style="font-size:2.6rem">🔒</div><h1 style="font-size:1.8rem;margin:6px 0 4px">Accès prof</h1>
    <p class="hint">Entrez le code pour ouvrir l'interface prof.</p>
    <form id="lockForm" class="row" style="justify-content:center">
      <input type="password" id="code" inputmode="numeric" autocomplete="off" placeholder="Code" style="padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:160px;text-align:center">
      <button class="btn pri">Entrer</button>
    </form>
    ${err?`<p style="color:var(--l1);font-weight:600;margin-top:10px">Code incorrect</p>`:""}
    <p style="margin-top:18px"><a href="#" style="color:var(--muted);font-size:.85rem">← Retour</a></p>
  </div></div>`;
  $("code").focus();
  $("lockForm").onsubmit=e=>{ e.preventDefault();
    if($("code").value.trim()===CONFIG.codeProf){ try{ localStorage.setItem(PROF_KEY,CONFIG.codeProf) }catch(e){} initProf(); }
    else renderLock(true); };
}

if(ROLE==="prof"){ profUnlocked() ? initProf() : renderLock(false); }
else if(ROLE==="tablette1") initTablette(1);
else if(ROLE==="tablette2") initTablette(2);
else renderHome();
</script>
